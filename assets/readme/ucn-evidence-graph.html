  if (s.line) { const l = mk('text', { x: x0 + w - 6, y: s.y + 3.5, 'font-size': 8.5, fill: '#8a8a8a', 'text-anchor': 'end', class: 'mono' }, gNodes); l.textContent = s.line; }
  if (s.list) { const l = mk('text', { x: x0 + 6, y: s.y + 20, 'font-size': 8, fill: '#8a8a8a', class: 'mono' }, gNodes); l.textContent = s.list; }
  s.text = t;
}
// edges: border-to-border quadratic curves
function border(n, toward) { const dx = toward.x - n.x, dy = toward.y - n.y; const k = Math.max(Math.abs(dx) / (n.w / 2), Math.abs(dy) / (n.h / 2)) || 1; return { x: n.x + dx / k, y: n.y + dy / k }; }
function edgeGeom(a, b, bow = 14) {
  const A = border(N[a], N[b]), B = border(N[b], N[a]);
  const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1;
  const cx = mx - dy / L * bow, cy = my + dx / L * bow;
  return { A, B, C: { x: cx, y: cy }, d: `M${A.x} ${A.y} Q${cx} ${cy} ${B.x} ${B.y}` };
}
const E = {};
for (const e of DATA.edges) { const g = edgeGeom(e.from, e.to); E[e.from + '>' + e.to] = g; g.el = mk('path', { d: g.d, fill: 'none', stroke: css('edge'), 'stroke-width': 1, 'marker-end': 'url(#arr)' }, gEdges); }
const qpt = (A, C, B, u) => ({ x: (1 - u) * (1 - u) * A.x + 2 * (1 - u) * u * C.x + u * u * B.x, y: (1 - u) * (1 - u) * A.y + 2 * (1 - u) * u * C.y + u * u * B.y });

// evidence paths per row
const PANEL = { left: 384, top: 62 };
function evidencePath(x) {
  const ev = x.r.evidence, from = N[ev.from];
  const p0 = { x: 376 - PANEL.left, y: ROW0 + x.i * LH + 6 - PANEL.top };
  const entry = { x: from.x - from.w / 2, y: from.y };
  let d = `M${p0.x} ${p0.y} C${p0.x + 26} ${p0.y} ${entry.x - 30} ${entry.y} ${entry.x} ${entry.y}`;
  let stop = null;
  if (ev.kind === 'import' || ev.kind === 'edge' || ev.kind === 'unresolved') {
    const g = E[ev.from + '>' + (ev.via || ev.to)];
    if (ev.kind === 'unresolved') { const u = 0.62; const P = qpt(g.A, g.C, g.B, u); const Cm = { x: (1 - u) * g.A.x + u * g.C.x, y: (1 - u) * g.A.y + u * g.C.y }; d += ` L${g.A.x} ${g.A.y} Q${Cm.x} ${Cm.y} ${P.x} ${P.y}`; stop = P; }
    else d += ` L${g.A.x} ${g.A.y} Q${g.C.x} ${g.C.y} ${g.B.x} ${g.B.y}`;
  } else if (ev.kind === 'owner' && ev.from !== SUB.methods.node) {
    const g = E[ev.from + '>' + SUB.methods.node]; d += ` L${g.A.x} ${g.A.y} Q${g.C.x} ${g.C.y} ${g.B.x} ${g.B.y}`;
  }

  if (target) { const s = SUB[target], n = N[s.node]; const tx = n.x - n.w / 2 + 7, ty = s.y; d += ` L${tx} ${ty}`; }

const EV = R.map(x => {
  const { d, stop, target } = evidencePath(x);
  const col = COLOR[x.r.verdict];
  const trail = mk('path', { d, fill: 'none', stroke: col, 'stroke-width': 1.5, 'stroke-linecap': 'round', opacity: 0, 'stroke-dasharray': x.r.verdict === 'unverified' ? '3 3' : 'none' }, gEv);
  const dot = mk('circle', { r: 3, fill: col, opacity: 0 }, gEv);
  const L = trail.getTotalLength();
  return { trail, dot, L, stop, target, col, x };
});
// badges
const badge = (x, y, col) => { const g = mk('g', { opacity: 0 }, gBadges); mk('circle', { cx: x, cy: y, r: 8, fill: col }, g); const t = mk('text', { x, y: y + 3.5, 'font-size': 10, 'font-weight': 600, fill: '#181818', 'text-anchor': 'middle', class: 'mono' }, g); return { g, t }; };
const pinBadge = badge(N.pathutil.x + N.pathutil.w / 2 - 16, SUB.pin.y, COLOR.confirmed);
const methBadge = badge(N.walk.x + N.walk.w / 2 - 16, SUB.methods.y, COLOR['other-target']);
const unrStop = EV.find(e => e.x.r.verdict === 'unverified').stop;
const unrBadge = (() => { const g = mk('g', { opacity: 0 }, gBadges); mk('circle', { cx: unrStop.x, cy: unrStop.y, r: 7, fill: '#181818', stroke: COLOR.unverified, 'stroke-width': 1.5, 'stroke-dasharray': '2 2' }, g); const t = mk('text', { x: unrStop.x, y: unrStop.y + 3.5, 'font-size': 10, fill: COLOR.unverified, 'text-anchor': 'middle', 'font-weight': 600 }, g); t.textContent = '?'; const l = mk('text', { x: unrStop.x - 11, y: unrStop.y + 3.5, 'font-size': 8.5, fill: COLOR.unverified, 'text-anchor': 'end', class: 'mono' }, g); l.textContent = 'name only'; return { g }; })();
// ticks (non-call rows that only touch a file)
const tickDots = R.map(x => { const ev = x.r.evidence; if (ev.kind !== 'tick') return null; const n = N[ev.from]; const k = n.ticks++; const c = mk('circle', { cx: n.x + n.w / 2 - 10 - k * 9, cy: n.y - n.h / 2 + 9, r: 2.5, fill: ev.note ? COLOR.definition : COLOR[x.r.verdict], opacity: 0 }, gTicks); return c; });
// non-call tally
const tally = mk('text', { x: 6, y: 330, 'font-size': 9.5, fill: '#8a8a8a', class: 'mono' });
const tallyHead = mk('text', { x: 6, y: 2, 'font-size': 0 }); // placeholder

const stateEl = document.getElementById('state'), cmdT = document.querySelector('#cmd .t'), cur = document.querySelector('#cmd .cur');
const acc1 = document.getElementById('acc1'), acc2 = document.getElementById('acc2'), seam = document.getElementById('seam');
const mix = (a, b, p) => { const h = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)); const A = h(a), B = h(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * p)).join(',')})`; };
const escapeHtml = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

window.__render = function (t) {
  const typed = t < T_CMD ? 0 : Math.min(CMD.length, Math.floor((t - T_CMD) / CMD_STEP));
  cmdT.textContent = CMD.slice(0, typed);
  cur.style.opacity = (t < T_ADJ && (typed < CMD.length || Math.floor(t * 2.2) % 2 === 0)) ? 1 : 0;
  const landed = R.filter(x => t >= x.t + FLY).length;
  let s = '', col = 'var(--muted)', glow = 'none';
  if (t >= T_OK) { s = 'CONSERVED ✓'; col = 'var(--ok)'; glow = '0 0 12px rgba(116,213,139,.55)'; }
  else if (t >= T_ACC) s = 'reconciling';
  else if (t >= T_ADJ) s = `consulting the index ${landed}/${rows.length}`;
  else if (t >= T_OCCURRENCES) s = `${DATA.symbol} · ${Math.min(rows.length, Math.floor((t - T_OCCURRENCES) / OCCURRENCE_STEP) + 1)} matching lines`;
  stateEl.textContent = s; stateEl.style.color = col; stateEl.style.textShadow = glow; stateEl.style.fontWeight = t >= T_OK ? '600' : '400';

  const nodeFlash = {}; const subFlash = {}; let pinN = 0, methN = 0, unrN = 0; const nonCall = { definition: 0, import: 0, reference: 0, 'other-text': 0 };
  R.forEach((x, i) => {
    const a = easeOut(ramp(t, T_OCCURRENCES + i * OCCURRENCE_STEP, 0.16));
    x.el.style.opacity = a; x.el.style.transform = `translateX(${(1 - a) * -8}px)`;
    const p = ramp(t, x.t, 0.18);
    x.mark.style.opacity = easeOut(ramp(t, x.t, 0.12));
    x.bg.style.opacity = p > 0 ? 0.14 * (1 - easeInOut(ramp(t, x.t + 0.05, 0.6))) : 0;
    x.path.style.color = p > 0 ? mix('#a0a0a0', '#ffffff', p) : '';
    x.code.style.color = p > 0 ? mix('#5c5c5c', '#e6e6e6', p) : '';
    x.tg.style.opacity = easeOut(ramp(t, x.t + 0.05, 0.25));
    const ev = EV[i], f = ramp(t, x.t + 0.03, FLY - 0.03);
    if (f <= 0) { ev.trail.style.opacity = 0; ev.dot.style.opacity = 0; }
    else {
      const e = easeInOut(f), len = ev.L * e;
      ev.trail.setAttribute('stroke-dasharray', x.r.verdict === 'unverified' ? '3 3' : `${ev.L}`);
      if (x.r.verdict !== 'unverified') ev.trail.setAttribute('stroke-dashoffset', ev.L - len);
      else ev.trail.style.clipPath = ''; // dashed trail reveals with opacity only
      const fade = f >= 1 ? 1 - easeOut(ramp(t, x.t + FLY, 0.5)) : 1;
      ev.trail.style.opacity = (x.r.verdict === 'unverified' && f < 1 ? f : 1) * fade * (x.r.verdict === 'other-text' || x.r.verdict === 'reference' ? 0.6 : 0.9);
      const P = ev.trail.getPointAtLength(len);
      ev.dot.setAttribute('cx', P.x); ev.dot.setAttribute('cy', P.y);
      const pop = f >= 1 ? ramp(t, x.t + FLY, 0.3) : 0;
      ev.dot.setAttribute('r', f >= 1 ? 3 + 4 * pop : 3);
      ev.dot.style.opacity = f >= 1 ? 1 - pop : 1;
      if (f >= 1) {
        const fl = 1 - easeOut(ramp(t, x.t + FLY, 0.7));
        nodeFlash[x.r.evidence.from] = Math.max(nodeFlash[x.r.evidence.from] || 0, fl);
        if (ev.target) subFlash[ev.target] = Math.max(subFlash[ev.target] || 0, fl);
        if (x.r.evidence.kind === 'import' || x.r.evidence.kind === 'edge') { const g = E[x.r.evidence.from + '>' + (x.r.evidence.via || x.r.evidence.to)]; g.flash = Math.max(g.flash || 0, fl); g.flashCol = ev.col; }
        if (x.r.verdict === 'confirmed') pinN++; else if (x.r.verdict === 'other-target') methN++; else if (x.r.verdict === 'unverified') unrN++; else nonCall[x.r.verdict]++;
        if (tickDots[i]) tickDots[i].style.opacity = 1;
      } else if (tickDots[i]) tickDots[i].style.opacity = 0;
    }
  });
  for (const [id, n] of Object.entries(N)) { const fl = nodeFlash[id] || 0; n.rect.setAttribute('stroke', fl > 0 ? '#ffffff' : css('border')); n.rect.setAttribute('stroke-opacity', fl > 0 ? 0.25 + 0.75 * fl : 1); }
  for (const [id, s] of Object.entries(SUB)) { const fl = subFlash[id] || 0; if (s.rect) { s.rect.setAttribute('fill-opacity', 0.09 + 0.35 * fl); s.rect.setAttribute('stroke-opacity', 0.35 + 0.65 * fl); } s.text.setAttribute('fill', s.small ? mix('#8a8a8a', '#74d58b', fl) : s.color); }
  for (const g of Object.values(E)) { const fl = g.flash || 0; g.el.setAttribute('stroke', fl > 0 ? g.flashCol : css('edge')); g.el.setAttribute('stroke-width', 1 + 1.2 * fl); g.el.setAttribute('stroke-opacity', 1); g.flash = 0; }
  pinBadge.t.textContent = pinN; pinBadge.g.setAttribute('opacity', pinN > 0 ? 1 : 0);
  methBadge.t.textContent = methN; methBadge.g.setAttribute('opacity', methN > 0 ? 1 : 0);
  unrBadge.g.setAttribute('opacity', unrN > 0 ? 1 : 0);
  const nc = nonCall.definition + nonCall.import + nonCall.reference + nonCall['other-text'];
  tally.textContent = `non-call ${nc}: definition ${nonCall.definition} · import ${nonCall.import} · reference ${nonCall.reference} · text ${nonCall['other-text']}`;
  tally.setAttribute('opacity', t >= T_ADJ ? 1 : 0);

  const chars = t < T_ACC ? 0 : Math.floor((t - T_ACC) / ACC_STEP);
  acc1.textContent = ACC1.slice(0, chars);
  const s2 = ACC2.slice(0, Math.max(0, chars - ACC1.length)); const k = s2.lastIndexOf('0 unaccounted');
  if (k >= 0 && t >= T_OK) acc2.innerHTML = escapeHtml(s2.slice(0, k)) + `<span style="color:var(--ok);font-weight:600">${escapeHtml(s2.slice(k))}</span>`; else acc2.textContent = s2;
  seam.style.opacity = Math.max(1 - ramp(t, 0, 0.12), ramp(t, T_END - 0.15, 0.15));
};

if (!window.__headless) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) window.__render(window.__stillTime);
  else { let paused = false, base = performance.now(), frozen = 0;
    document.getElementById('stage').addEventListener('click', () => { if (paused) base = performance.now() - frozen * 1000; else frozen = ((performance.now() - base) / 1000) % T_END; paused = !paused; });

}
})();
