name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5

      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "CI"

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install clangd 18 (C/C++ oracle test)
        run: |
          sudo apt-get update
          sudo apt-get install -y clangd-18
          sudo ln -sf /usr/bin/clangd-18 /usr/local/bin/clangd
          clangd --version

      # Rows of test/runtime-liveness-cases.json that run pytest (some with
      # pytest-mock) are skipped by an interpreter that cannot import them.
      # One pinned interpreter with both, named by PYTHON for npm test.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install pytest and pytest-mock (runtime-liveness rows)
        run: |
          python -m pip install --disable-pip-version-check pytest==9.2.0 pytest-mock==3.17.0
          echo "PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          python -c 'import pytest, pytest_mock; print("pytest", pytest.__version__)'

      - name: Run lint
        run: npm run lint

      - name: Run tests
        shell: bash
        run: npm test 2>&1 | tee test-output.txt

      - name: Update test count badge
        if: matrix.node-version == 24 && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          # Match both reporter formats: TAP ("# pass N") and spec ("ℹ pass N").
          # Node's default test reporter changed with the runtime version, so the
          # badge must not depend on which one this matrix entry produces.
          PASS=$(grep -E '^(#|ℹ) pass ' test-output.txt | tail -1 | awk '{print $NF}')
          TOTAL=$(grep -E '^(#|ℹ) tests ' test-output.txt | tail -1 | awk '{print $NF}')
          if [ -z "$PASS" ] || [ -z "$TOTAL" ]; then
            echo "::error::could not parse test counts from test-output.txt"
            exit 1
          fi
          echo "{\"schemaVersion\":1,\"label\":\"tests\",\"message\":\"${PASS}/${TOTAL} passing\",\"color\":\"brightgreen\"}" > badge.json
          curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.GIST_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/gists/0e10a790e16ab61ddd233e05645e203e \
            -d "{\"files\":{\"ucn-tests.json\":{\"content\":$(cat badge.json | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')}}}"
