name: Eval

# Reliability/accuracy evaluation on pinned real repos:
#  - conservation: account invariant + engine-gap metrics (43 pinned repos,
#    covering JavaScript/TypeScript, Python, Go, Rust, Java, C/C++, and C#)
#  - oracle: tiered caller answers vs compiler/LSP ground truth (ts-morph for
#    TS repos; pyright-langserver over LSP for Python, jedi available as a
#    second opinion via --oracle jedi with a self-bootstrapping venv; gopls
#    for Go; rust-analyzer for Rust; jdtls for Java);
#    fails when missing-unexplained > 0 (the contract gate)
#  - deadcode: every deadcode claim checked for oracle references — fails
#    when a default-arm claim has a reference UCN missed (false-dead gate)
#  - consistency: deterministic stable-handle board requires overlapping find,
#    show, source, impact, tests, check, and caller-trace claims to agree exactly
#  - matrices: small projects the eval writes itself, each judged by the
#    language's own compiler or test runner (deletion: a deletion the engine
#    clears and the compiler rejects; check: READY for a change the compiler
#    rejects or BLOCKED for one it accepts; test-unit: a listed test the
#    runner never executes or a printed command that runs something else)
# Separate from ci.yml: heavier, network-dependent, weekly + on demand. A push
# does not start it. A manual dispatch from main is the required pre-tag
# release dry run.

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the schedule-only arms (full-board conservation/oracle/fresh/deadcode/consistency/performance) — rehearses the Monday board on demand"
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: matrix
        env:
          UCN_EVAL_FULL: ${{ inputs.full || false }}
        run: node eval/run-ci-plan.js

  eval:
    name: Eval (${{ matrix.id }})
    needs: plan
    runs-on: ubuntu-latest
    # The test-unit matrix starts a test runner about two thousand times; the
    # release row runs the matrices after the release board.
    timeout-minutes: ${{ matrix.kind == 'release' && 150 || matrix.kind == 'matrices' && 120 || 45 }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # Distinct directories preserve every rollup when artifacts merge.
      UCN_EVAL_REPORTS_DIR: ${{ github.workspace }}/eval/reports/${{ matrix.id }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install gopls (Go oracle)
        run: |
          go install golang.org/x/tools/gopls@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install rust-analyzer (Rust oracle)
        run: |
          rustup component add rust-analyzer rust-src
          rust-analyzer --version

      - name: Install clangd 18 (C/C++ oracle)
        run: |
          sudo apt-get update
          sudo apt-get install -y clangd-18
          sudo ln -sf /usr/bin/clangd-18 /usr/local/bin/clangd

      # The Roslyn oracle builds its helper with, and evaluates the target's
      # projects under, the newest installed SDK (9.0 floor); 10.0 restores
      # and compiles net10.0 projects (tests, samples) the 9.0 SDK cannot.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install jdtls (Java oracle)
        run: |
          # Eclipse prunes old milestones (only the latest is served) — when this
          # 404s, repin: list https://download.eclipse.org/jdtls/milestones/,
          # download the tarball, sha256sum it, update BOTH lines below.
          curl -fsSL -o /tmp/jdtls.tar.gz "https://download.eclipse.org/jdtls/milestones/1.60.0/jdt-language-server-1.60.0-202606262232.tar.gz"
          echo "e94c303d8198f977930803582738771fd18c52c5492878410bf222b1aa81ef1d  /tmp/jdtls.tar.gz" | sha256sum -c
          mkdir -p "$HOME/jdtls" && tar -xzf /tmp/jdtls.tar.gz -C "$HOME/jdtls"
          echo "UCN_EVAL_JDTLS=$HOME/jdtls/bin/jdtls" >> "$GITHUB_ENV"

      # pytest, jest, vitest, mocha and the C++ compiler, for the matrices: on
      # their own runner and on the release row, whose gate runs them too.
      - name: Matrix toolchains
        if: ${{ matrix.kind == 'matrices' || matrix.kind == 'release' }}
        uses: ./.github/actions/matrix-toolchains

      - run: npm ci
        id: dependencies

      # Measure before compiler servers and verbose reports perturb timing.
      - name: "Performance gate (cold build, warm cache, semantic query p95)"
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && matrix.kind == 'checks' && (github.event_name == 'schedule' || inputs.full) }}
        run: npm run trust:gate:performance

      # An earlier failed arm must not hide the other independent reports.
      # Failed steps still fail the job; cancellation and setup failure stop work.
      - name: Conservation eval (pinned repos)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && matrix.kind == 'checks' && (github.event_name == 'schedule' || inputs.full) }}
        run: node eval/conservation-real.js

      - name: "Oracle eval (gate: missing-unexplained = 0)"
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && matrix.kind == 'oracle' }}
        env:
          EVAL_REPOS: ${{ matrix.repos }}
        run: node eval/run-oracle-eval.js --repo "$EVAL_REPOS"

      - name: "Fresh-repo oracle eval (2 unpinned repos, weekly rotation — generalization gate)"
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && matrix.kind == 'checks' && (github.event_name == 'schedule' || inputs.full) }}
        run: node eval/run-oracle-eval.js --fresh 2 --max-unscored-ratio 0.10

      - name: "Deadcode eval (gate: default-arm false-dead = 0)"
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && matrix.kind == 'checks' && (github.event_name == 'schedule' || inputs.full) }}
        run: node eval/run-deadcode-eval.js --sample 300

      - name: "Cross-command consistency (gate: disagreements = 0)"
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && matrix.kind == 'checks' && (github.event_name == 'schedule' || inputs.full) }}
        run: npm run trust:gate:consistency

      # Task-outcome gate on the PINNED tuned set (websocket/flask/serde_json —
      # the repos whose outcome findings drove fixes #293-#298; pinned commit +
      # fixed seed → deterministic tasks). Thresholds: judge/proposal errors 0,
      # contract delete falseSafe 0, contract rename <= grep baseline. Runs on
      # every trigger, and inside npm run trust:gate, which the publish job and
      # the pre-tag dry run execute.
      - name: "Outcome gate (pinned tuned set, toolchain-judged)"
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && matrix.kind == 'checks' }}
        run: node eval/run-outcome-eval.js --gate

      # Toolchain-judged matrices, on every trigger, on their own runner. A
      # toolchain that is not installed fails its matrix: a case that was not
      # judged is never a pass. Like the outcome gate above they also run
      # inside npm run trust:gate, in the publish job and the pre-tag dry run,
      # with the same toolchain action.
      - name: "Deletion matrix (gate: false-safe = 0)"
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && matrix.kind == 'matrices' }}
        run: node eval/run-deletion-matrix.js

      - name: "Check matrix (gate: false-ready = 0, false-blocked = 0)"
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && matrix.kind == 'matrices' }}
        run: node eval/run-check-matrix.js

      - name: "Test-unit matrix (gate: every listed test and printed command judged by its runner)"
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && matrix.kind == 'matrices' }}
        run: node eval/run-test-unit-matrix.js

      - name: "Pre-tag release dry run (publish-blocking board)"
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && matrix.kind == 'release' }}
        run: npm run trust:gate

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eval-reports-${{ matrix.id }}
          path: eval/reports/
          retention-days: 90

  reports:
    name: Collect evaluation reports
    needs: [plan, eval]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Each job has its own subdirectory, so same-dated rollups never
      # overwrite one another. Failed jobs still upload their evidence.
      - uses: actions/upload-artifact/merge@v6
        with:
          name: eval-reports
          pattern: eval-reports-*
          retention-days: 90
