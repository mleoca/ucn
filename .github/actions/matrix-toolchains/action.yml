name: Matrix toolchains
description: >-
  Test runners and the C++ compiler that the deletion, check and test-unit
  matrices need on top of a job's Node, Go, Rust, Java and .NET setup.

# One definition for every job that runs the matrices: the job that qualifies
# them and a job that later enforces them get the same tools. Versions that
# the runner image does not fix are fixed here; Go, Rust, .NET and Maven are
# the ones the calling job installed or the image ships. Each matrix report
# names the versions that judged.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Install pytest
      shell: bash
      run: python -m pip install --disable-pip-version-check pytest==9.2.0

    # The test-unit matrix links this directory into every JavaScript case.
    - name: Install jest, vitest and mocha
      shell: bash
      run: |
        tools="$RUNNER_TEMP/ucn-js-test-runners"
        mkdir -p "$tools"
        npm install --prefix "$tools" --no-audit --no-fund --no-package-lock jest@29.7.0 vitest@3.2.7 mocha@11.8.0
        echo "UCN_JS_TEST_MODULES=$tools/node_modules" >> "$GITHUB_ENV"

    - name: Select clang 18 as the C++ compiler
      shell: bash
      run: |
        if ! command -v clang++-18 > /dev/null; then
          sudo apt-get update
          sudo apt-get install -y clang-18
        fi
        echo "CXX=clang++-18" >> "$GITHUB_ENV"

    # A missing tool stops the job here, before a matrix reports it as
    # cases it could not judge.
    - name: Toolchain versions
      shell: bash
      run: |
        node --version
        python --version
        pytest --version
        go version
        rustc --version
        cargo --version
        javac -version
        mvn --version
        dotnet --version
        clang++-18 --version
